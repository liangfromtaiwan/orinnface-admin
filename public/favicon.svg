       内側の枠は撮影・解析フレームを示唆する装飾で、小サイズではリムとして残る。 -->
  <rect width="32" height="32" rx="7" fill="#18181B"/>
  <rect x="4.6" y="4.6" width="22.8" height="22.8" rx="5.2"
        fill="none" stroke="#7CB518" stroke-width="1.5" opacity="0.45"/>
  <g fill="#7CB518">
    <circle cx="12" cy="13.4" r="2.2"/>
    <circle cx="20" cy="13.4" r="2.2"/>
  </g>
  <path d="M10.9 19.3a6.4 6.4 0 0 0 10.2 0" fill="none" stroke="#7CB518"
        stroke-width="3" stroke-linecap="round"/>
</svg>
